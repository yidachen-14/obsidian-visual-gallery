name: Prepare verified 0.1.23 release assets
on:
  push:
    paths: [.github/workflows/release-0123-upload.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a6763f786446ff5c339a306582de1dcb4507169
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify tested runtime bytes
        run: |
          sha256sum --check <<'SUMS'
          4586529271ef4308ff4d164336b9abb8d1186f7de1da3dd0b44654914ee0bb14  main.js
          0576d81c7e6a6fd1f1f0f891c7e453b9b73e39ad4016811bc242d03a82da5bd3  manifest.json
          f0b64ced16ed5cd678038826cef1c633c9caa33610e2a996152dd4a326ea2bb1  styles.css
          SUMS
      - name: Upload only to unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          releaseDraft=$(gh api "repos/$GH_REPO/releases/416484343" --jq '.draft')
          test "$releaseDraft" = true
          gh api "repos/$GH_REPO/releases/416484343" --method PATCH -f tag_name=0.1.23 -f target_commitish=5a6763f786446ff5c339a306582de1dcb4507169 --silent
          gh api "repos/$GH_REPO/releases/416484343/assets" --jq '.[] | select(.name == "main.js" or .name == "manifest.json" or .name == "styles.css") | .id' > "$RUNNER_TEMP/vg-draft-assets.txt"
          while read -r assetId; do
            gh api "repos/$GH_REPO/releases/assets/$assetId" --method DELETE --silent
          done < "$RUNNER_TEMP/vg-draft-assets.txt"
          gh release upload 0.1.23 main.js manifest.json styles.css --repo "$GH_REPO"
          gh api "repos/$GH_REPO/releases/416484343" --jq '{id,tag_name,draft,target_commitish,assets:[.assets[]|{name,size,digest,state}]}'
