name: Verify 0.1.25 draft assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-025-draft-assets.yml']
permissions:
  contents: write
jobs:
  draft-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f3b12b04a71bf018f35ced3ba3a16c249d0d366
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify hashes and upload only to unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os,json,hashlib,urllib.request
          base='https://api.github.com/repos/yidachen-14/obsidian-visual-gallery'
          release_id=417524974
          source='6f3b12b04a71bf018f35ced3ba3a16c249d0d366'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def call(url,method='GET',data=None,content='application/json'):
              payload=json.dumps(data).encode() if isinstance(data,dict) else data
              request=urllib.request.Request(url,data=payload,method=method,headers={**headers,'Content-Type':content})
              with urllib.request.urlopen(request) as r:return json.load(r)
          def guard():
              r=call(base+'/releases/'+str(release_id))
              assert r['id']==release_id and r['draft'] is True and r['tag_name']=='0.1.25', 'Refuse to change published or unrelated release'
              return r
          expected={'main.js':'14ce8881500e51ebd1b57967a78c796d72c110f1caf0523c27f4fc7ed59295b0','manifest.json':'cd2a9fc08f1dcbab1aeebf75f5cdb8a8e793c8da31a6c1e6f4727d2ae7f608e1','styles.css':'de73b05d503cf130a58db3854217055f313c025d0f5114191c2b45c97f72f87f'}
          for name,digest in expected.items():assert hashlib.sha256(open(name,'rb').read()).hexdigest()==digest,name+' does not reproduce tested bytes'
          r=guard()
          assert not r['assets'],'Unexpected existing draft assets'
          call(base+'/releases/'+str(release_id),'PATCH',{'tag_name':'0.1.25','target_commitish':source})
          for name in expected:
              r=guard();assert r['target_commitish']==source
              asset=call('https://uploads.github.com/repos/yidachen-14/obsidian-visual-gallery/releases/'+str(release_id)+'/assets?name='+name,'POST',open(name,'rb').read(),'application/octet-stream')
              assert asset['state']=='uploaded' and asset['name']==name
              print(name,asset.get('digest'))
          r=guard();assert sorted(a['name'] for a in r['assets'])==sorted(expected)
          print('Verified draft-only runtime assets',r['id'],r['target_commitish'])
          PYCODE
