name: Prepare verified 0.1.22 release assets
on:
  push:
    paths: [.github/workflows/release-0122-upload.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bec85cb821c1f3e27f16265c9bdb551cd9e6dea0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify tested runtime bytes
        run: |
          sha256sum --check <<'SUMS'
          cc0f7f43fee1c309697ac21b657d05c1c4f89dc067e6bb694f0e725221d3689a  main.js
          3813b84fc86d4689d37257e533f4ca0d222a245f4c54b15ae1b4d88704dfd474  manifest.json
          f0b64ced16ed5cd678038826cef1c633c9caa33610e2a996152dd4a326ea2bb1  styles.css
          SUMS
      - name: Upload only to the unpublished 0.1.22 draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          releaseDraft=$(gh api "repos/$GH_REPO/releases/416425081" --jq '.draft')
          test "$releaseDraft" = true
          gh api "repos/$GH_REPO/releases/416425081" --method PATCH -f tag_name=0.1.22 -f target_commitish=bec85cb821c1f3e27f16265c9bdb551cd9e6dea0 --silent
          gh api "repos/$GH_REPO/releases/416425081/assets" --jq '.[] | select(.name == "main.js" or .name == "manifest.json" or .name == "styles.css") | .id' > "$RUNNER_TEMP/vg-draft-assets.txt"
          while read -r assetId; do
            gh api "repos/$GH_REPO/releases/assets/$assetId" --method DELETE --silent
          done < "$RUNNER_TEMP/vg-draft-assets.txt"
          gh release upload 0.1.22 main.js manifest.json styles.css --repo "$GH_REPO"
          gh api "repos/$GH_REPO/releases/416425081" --jq '{id, tag_name, draft, target_commitish, assets: [.assets[] | {name, size, digest, state}]}'
